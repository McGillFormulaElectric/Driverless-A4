version: '3.8'

services:
  a4:
    build:
      context: .
    image: mfe/a4:humble
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=42
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        set -e;
        source /opt/ros/humble/setup.bash;
        colcon build --symlink-install;
        source install/setup.bash;
        ros2 launch a4_new_member bringup.launch.py github_user:=student
      "
