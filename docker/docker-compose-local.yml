version: '3.8'

services:
  student:
    build:
      context: .
    image: mfe/a2:humble
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GITHUB_USER=student
      - A2_NEIL_HOST=127.0.0.1
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 run a4_new_member hello_publisher --ros-args -r __ns:=/student &
        ros2 launch a4_new_member lpf.launch.py github_user:=student
      "

  grader:
    build:
      context: .
    image: mfe/a2:humble
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GITHUB_USER=grader
    volumes:
      - ../ros2_ws:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install &&
        source install/setup.bash &&
        ros2 launch a4_grader neil.launch.py
      "
