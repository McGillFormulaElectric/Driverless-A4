# Neil-side scenario parameters for MFE A4.
# Loaded by neil.launch.py into both sensor_sim_node and grader.
# The /** wildcard matches any node name/namespace so both nodes read the same
# file; each node only reads the keys it declares, so unrelated keys are
# silently ignored.
/**:
  ros__parameters:
    # --- sensor_sim_node ------------------------------------------------------
    imu_hz: 50.0              # IMU publish rate [Hz]
    gps_hz: 5.0               # GPS publish rate [Hz]
    imu_accel_sigma: 0.2      # noise sigma on body-forward accel [m/s^2]
    imu_yaw_rate_sigma: 0.02  # noise sigma on yaw rate [rad/s]
    gps_pos_sigma: 0.5        # noise sigma on GPS x/y [m]
    seed: 20260909            # RNG seed for reproducible runs

    # Trajectory (figure-8): two lobes of radius ~8 m.
    v_ss: 5.0                 # steady-state forward speed [m/s]
    tau_ramp: 2.0             # speed ramp-up time constant [s]
    omega_max: 1.0            # peak yaw rate [rad/s]
    traj_period: 19.7392088   # yaw-rate period [s]  (2*pi^2)

    # --- grader ---------------------------------------------------------------
    dr_rmse_threshold: 5.0    # A4.1 pass threshold [m]
    dr_window_s: 10.0         # A4.1 scoring window on sim time [s]
    ekf_rmse_threshold: 0.5   # A4.2 pass threshold [m]
    match_window: 200         # A4.2 last-N samples window
    discovery_period_s: 2.0   # how often grader scans for /<user>/odom* topics
    grade_period_s: 2.0       # how often grader computes RMSE + publishes verdicts
